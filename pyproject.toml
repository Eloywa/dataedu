[project]
name = "dataedu-django"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django==5.2.*",
    "markdown>=3.10.2",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    # Отдаёт статику самим приложением: под нагрузкой файлы уходят с вечным
    # заголовком кэша и хешем в имени, отдельный nginx для этого не нужен.
    "whitenoise>=6.9",
]

[project.optional-dependencies]
# Общий кэш и сессии для нескольких рабочих процессов. Нужен только в эксплуатации.
redis = ["redis>=5.0"]
