[project]
name = "dataedu-django"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django==5.2.*",
    "markdown>=3.10.2",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    # Отдаёт статику самим приложением: под нагрузкой файлы уходят с вечным
    # заголовком кэша и хешем в имени, отдельный nginx для этого не нужен.
    "whitenoise>=6.9",
    "django-jazzmin>=3.0.1",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
# Общий кэш и сессии для нескольких рабочих процессов. Нужен только в эксплуатации.
redis = ["redis>=5.0"]

[tool.ruff]
# Ширина строки чуть больше стандартных 88: объявления полей Django с русскими
# названиями и help_text в 88 не помещаются и рвутся на неудобные куски.
line-length = 100
target-version = "py313"
# Миграции генерирует Django — переформатировать их вручную незачем, а расхождение
# с тем, что он породит в следующий раз, только мешает читать историю схемы.
extend-exclude = ["*/migrations/*", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = [
    # Длина строки — забота форматтера, а не проверки: иначе он и она спорят
    # об одних и тех же строках.
    "E501",
    # «Строковое поле допускает NULL». Замечание справедливо для новой схемы, но
    # здесь имена и типы колонок повторяют исходную базу первой версии платформы —
    # именно поэтому данные удалось перелить напрямую. Убрать NULL значило бы
    # разойтись со схемой-источником ради стилистики.
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
# Профили настроек собираются из base через звёздочный импорт — это их устройство.
"config/settings/*.py" = ["F403", "F405"]
