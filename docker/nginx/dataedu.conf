# nginx перед DataEdu: отдаёт статику, остальное передаёт gunicorn.

upstream dataedu {
    server web:8000;
    keepalive 16;
}

# Тип для WebAssembly. В mime.types он есть не во всех сборках nginx, а PGlite
# грузит движок через WebAssembly.instantiateStreaming — тот отказывается
# работать со всем, кроме application/wasm, и тренажёр не поднимается вовсе.
types {
    application/wasm wasm;
}

server {
    listen 80;
    server_name _;

    # Тренажёр отдаёт .sql и .csv, преподаватель выгружает ведомости.
    client_max_body_size 12m;

    # Логи в поток контейнера: их подхватит docker logs или сборщик на хосте.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # Статика — мимо приложения. Файлы собраны с хешами в именах
    # (CompressedManifestStaticFilesStorage), поэтому кэш можно ставить вечный:
    # при изменении файла меняется имя.
    location /static/ {
        alias /var/www/static/;
        access_log off;
        # Год и `immutable` одним заголовком. Директива `expires` выставила бы
        # второй Cache-Control рядом с этим — браузеры такое переживают, но
        # разбираться в двух разных заголовках на один вопрос потом никому
        # не захочется.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # WhiteNoise кладёт рядом .gz и .br. Отдаём готовое сжатие вместо того,
        # чтобы жать 18 МБ вендора на каждый запрос.
        gzip_static on;

        try_files $uri =404;
    }

    location / {
        proxy_pass http://dataedu;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Обязательно: profile prod читает этот заголовок (SECURE_PROXY_SSL_HEADER).
        # Без него Django считает любой запрос небезопасным и, если включён
        # SECURE_SSL, зацикливает переадресацию на https.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        # Больше, чем таймаут gunicorn: обрывать ответ раньше самого приложения
        # значит показывать 504 там, где оно ещё считает отчёт.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        proxy_redirect off;
        proxy_buffering on;
    }
}
